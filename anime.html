<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Hub</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            color: white;
            text-align: center;
        }

        header {
            background: url("https://images.unsplash.com/photo-1606116193348-0205a80f51ee?auto=format&fit=crop&w=1200&q=80") center/cover no-repeat;
            padding: 90px 20px;
            color: #fff;
            text-shadow: 0 0 10px #000;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 20px;
            opacity: 0.8;
        }

        .section-title {
            margin-top: 40px;
            font-size: 28px;
            text-shadow: 0 0 10px #5ab0ff;
        }

        .links {
            max-width: 700px;
            margin: auto;
            margin-top: 20px;
        }

        a.link {
            display: block;
            background: #111;
            padding: 15px;
            margin: 15px 0;
            border-radius: 12px;
            color: #61b8ff;
            font-size: 22px;
            text-decoration: none;
            transition: 0.3s;
            border: 1px solid #1f1f1f;
        }

        a.link:hover {
            background: #1a1a1a;
            transform: scale(1.04);
            box-shadow: 0 0 15px #007bff;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .gallery img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 0 10px #000;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #008cff;
        }

        .insta {
            margin-top: 50px;
            font-size: 22px;
        }

        .insta a {
            color: #ff66ff;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            background: #060606;
            font-size: 14px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <header>
        <h1>Anime Hub</h1>
        <p class="desc">All Anime Sites • One Place</p>
    </header>

    <h2 class="section-title">🔥 Working Anime Websites</h2>

    <div class="links">
        <a class="link" href="https://hianime.to" target="_blank">HiAnime</a>
        <a class="link" href="https://animesalt.to" target="_blank">AnimeSalt</a>
        <a class="link" href="https://animerulz.pro" target="_blank">AnimeRulz</a>
        <a class="link" href="https://aniwatchtv.to" target="_blank">Aniwatch (New)</a>
        <a class="link" href="https://kickassanime.mx" target="_blank">KickAssAnime</a>
        <a class="link" href="https://crunchyroll.com" target="_blank">Crunchyroll (Official)</a>
    </div>

    <h2 class="section-title">💫 Anime Visuals</h2>

    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1606116192469-abfa11636ab3?auto=format&fit=crop&w=600&q=80">
        <img src="https://images.unsplash.com/photo-1606116091481-2f3a45d4c6f1?auto=format&fit=crop&w=600&q=80">
        <img src="https://images.unsplash.com/photo-1606116042711-7c9af7093a74?auto=format&fit=crop&w=600&q=80">
        <img src="https://images.unsplash.com/photo-1606115915090-8398f0a5bbf5?auto=format&fit=crop&w=600&q=80">
        <img src="https://images.unsplash.com/photo-1606115882529-b2f68f280991?auto=format&fit=crop&w=600&q=80">
        <img src="https://images.unsplash.com/photo-1606115906150-1bd6c2b7d6e6?auto=format&fit=crop&w=600&q=80">
    </div>

    <div class="insta">
        Follow me on Instagram:  
        <br><br>
        <a href="https://instagram.com/the.okarun_" target="_blank">@the.okarun_</a>  
        &nbsp;|&nbsp;
        <a href="https://instagram.com/the.enjoji_" target="_blank">@the.enjoji_</a>
    </div>

    <footer>
        © 2025 Anime Hub • Made by You
    </footer>

</body>
</html>
